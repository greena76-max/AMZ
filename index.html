<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tayyaba Dawakhana & Hijama Center - Appointment Booking</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Jameel Noori Nastaliq Font -->
  <link href="https://fonts.cdnfonts.com/css/jameel-noori-nastaleeq" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            emeraldDark: '#113f23',
            emeraldMid: '#1b5e20',
            emeraldAccent: '#2e7d32',
            emeraldLight: '#f4f9f5',
          },
          fontFamily: {
            urdu: ['Jameel Noori Nastaleeq', 'Urdu Typesetting', 'serif'],
          }
        }
      }
    }
  </script>
  
  <style>
    .urdu-text {
      font-family: 'Jameel Noori Nastaleeq', 'Urdu Typesetting', serif;
      line-height: 1.8;
    }
  </style>
</head>
<body class="bg-emeraldLight min-h-screen flex items-center justify-center p-3 sm:p-6">

  <div class="max-w-xl w-full bg-white rounded-2xl shadow-2xl border border-emerald-100 overflow-hidden">
    
    <!-- Top Green Decorative Header -->
    <div class="bg-gradient-to-r from-emeraldDark via-emeraldMid to-emeraldDark text-white py-6 px-6 text-center shadow-md">
      <h1 class="text-2xl sm:text-3xl font-extrabold tracking-wide uppercase">
        TAYYABA DAWAKHANA & HIJAMA CENTER
      </h1>
      <p class="urdu-text text-lg sm:text-xl text-emerald-200 mt-1">
        طیبہ دواخانہ اینڈ حجامہ سنٹر
      </p>
      <div class="mt-2 inline-block bg-white/10 backdrop-blur-md px-4 py-1 rounded-full text-xs tracking-wider uppercase border border-white/20">
        Online Appointment Portal
      </div>
    </div>

    <!-- Booking Form -->
    <form id="appointmentForm" class="p-6 sm:p-8 space-y-5">
      
      <!-- Full Name -->
      <div>
        <div class="flex justify-between items-center mb-1">
          <label class="text-xs font-bold text-emeraldDark uppercase tracking-wider">Full Name</label>
          <span class="urdu-text text-sm font-bold text-emeraldDark">مریض کا نام</span>
        </div>
        <input type="text" id="fullName" required 
          class="w-full border border-gray-300 rounded-lg px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emeraldAccent focus:border-transparent transition" 
          placeholder="Enter patient name">
      </div>

      <!-- Phone Number -->
      <div>
        <div class="flex justify-between items-center mb-1">
          <label class="text-xs font-bold text-emeraldDark uppercase tracking-wider">Phone Number</label>
          <span class="urdu-text text-sm font-bold text-emeraldDark">فون نمبر</span>
        </div>
        <input type="tel" id="phone" required 
          class="w-full border border-gray-300 rounded-lg px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emeraldAccent focus:border-transparent transition" 
          placeholder="03001234567">
      </div>

      <!-- Date & Time Slot Grid -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <div class="flex justify-between items-center mb-1">
            <label class="text-xs font-bold text-emeraldDark uppercase tracking-wider">Date</label>
            <span class="urdu-text text-sm font-bold text-emeraldDark">تاریخ</span>
          </div>
          <input type="date" id="appointmentDate" required 
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emeraldAccent focus:border-transparent transition">
        </div>

        <div>
          <div class="flex justify-between items-center mb-1">
            <label class="text-xs font-bold text-emeraldDark uppercase tracking-wider">Time Slot</label>
            <span class="urdu-text text-sm font-bold text-emeraldDark">وقت</span>
          </div>
          <select id="timeSlot" 
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emeraldAccent focus:border-transparent transition bg-white">
            <option>10:00 AM - 12:00 PM</option>
            <option>02:00 PM - 04:00 PM</option>
            <option>05:00 PM - 07:00 PM</option>
            <option>08:00 PM - 10:00 PM</option>
          </select>
        </div>
      </div>

      <!-- Therapy Type -->
      <div>
        <div class="flex justify-between items-center mb-1">
          <label class="text-xs font-bold text-emeraldDark uppercase tracking-wider">Therapy Type</label>
          <span class="urdu-text text-sm font-bold text-emeraldDark">علاج کی قسم</span>
        </div>
        <select id="therapyType" 
          class="w-full border border-gray-300 rounded-lg px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emeraldAccent focus:border-transparent transition bg-white">
          <option>Sunnah Points Cupping — سنت پوائنٹس حجامہ</option>
          <option>Head Hijama (No Shaving) — سر کا حجامہ</option>
          <option>Full Body Detox — فل باڈی ڈیٹاکس</option>
          <option>General Consultation — عام معائنہ</option>
        </select>
      </div>

      <!-- Submit Button -->
      <button type="submit" id="submitBtn" 
        class="w-full bg-emeraldDark hover:bg-emeraldMid text-white font-bold py-3.5 px-4 rounded-xl shadow-lg hover:shadow-xl transition duration-300 flex justify-between items-center px-6">
        <span class="uppercase tracking-wider text-sm">Book Appointment</span>
        <span class="urdu-text text-base">اپائنٹمنٹ بُک کریں</span>
      </button>

    </form>

    <!-- Message Alert -->
    <div id="statusMessage" class="hidden mx-6 mb-6 p-4 rounded-xl text-center text-sm font-semibold border"></div>

  </div>

  <script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbzZ1-BGz2PFtGHqMr-LQt7zgd8gBmhZqOzrspY8OE8RDY_RIt8oREXq2E9zBuzGAxoV/exec';
    const form = document.getElementById('appointmentForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusMessage = document.getElementById('statusMessage');

    form.addEventListener('submit', e => {
      e.preventDefault();
      
      submitBtn.disabled = true;
      submitBtn.classList.add('opacity-75', 'cursor-not-allowed');
      submitBtn.innerHTML = `
        <span class="uppercase tracking-wider text-sm">Booking...</span>
        <span class="urdu-text text-base">بُکنگ ہو رہی ہے...</span>
      `;

      const data = {
        fullName: document.getElementById('fullName').value,
        phone: document.getElementById('phone').value,
        appointmentDate: document.getElementById('appointmentDate').value,
        timeSlot: document.getElementById('timeSlot').value,
        therapyType: document.getElementById('therapyType').value
      };

      fetch(scriptURL, {
        method: 'POST',
        mode: 'no-cors',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(data)
      })
      .then(() => {
        statusMessage.className = 'mx-6 mb-6 p-4 rounded-xl text-center text-sm font-semibold bg-emerald-50 text-emerald-900 border border-emerald-200 block shadow-sm';
        statusMessage.innerHTML = `
          <div>Appointment booked successfully!</div>
          <div class="urdu-text text-base mt-1">آپ کی اپائنٹمنٹ کامیابی سے بُک ہو گئی ہے!</div>
        `;
        submitBtn.disabled = false;
        submitBtn.classList.remove('opacity-75', 'cursor-not-allowed');
        submitBtn.innerHTML = `
          <span class="uppercase tracking-wider text-sm">Book Appointment</span>
          <span class="urdu-text text-base">اپائنٹمنٹ بُک کریں</span>
        `;
        form.reset();
      })
      .catch(error => {
        statusMessage.className = 'mx-6 mb-6 p-4 rounded-xl text-center text-sm font-semibold bg-red-50 text-red-800 border border-red-200 block shadow-sm';
        statusMessage.innerHTML = `
          <div>Something went wrong. Please try again.</div>
          <div class="urdu-text text-base mt-1">خرابی پیش آئی، دوبارہ کوشش کریں۔</div>
        `;
        submitBtn.disabled = false;
        submitBtn.classList.remove('opacity-75', 'cursor-not-allowed');
        submitBtn.innerHTML = `
          <span class="uppercase tracking-wider text-sm">Book Appointment</span>
          <span class="urdu-text text-base">اپائنٹمنٹ بُک کریں</span>
        `;
      });
    });
  </script>

</body>
</html>
