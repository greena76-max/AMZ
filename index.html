<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#002561">
  <meta name="description" content="HY STORE - Official Online Store">
  <link rel="icon" type="image/png" sizes="48x48" href="logo.png">
  <link rel="shortcut icon" type="image/png" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">
  <title>HY STORE | Official Online Store</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <style>
    :root{
      --bg:#050812;
      --surface:#0a1020;
      --surface-2:#0e1729;
      --surface-3:#121d33;
      --header:rgba(5,8,18,.88);
      --text:#f8fafc;
      --muted:#8fa0b8;
      --primary:#002561;
      --primary-2:#001A45;
      --accent:#FF6D00;
      --danger:#ff5470;
      --warning:#FF6D00;
      --success:#27d17f;
      --border:rgba(255,255,255,.08);
      --shadow:0 50px 60px rgba(0,0,0,.35);
      --radius:18px;
    }

    *{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{
      min-height:100vh;
      overflow-x:hidden;
      padding-bottom:84px;
      color:var(--text);
      font-family:Poppins,Arial,sans-serif;
      background:
        radial-gradient(circle at 8% 0%,rgba(0,37,97,.13),transparent 27%),
        radial-gradient(circle at 95% 18%,rgba(255,109,0,.07),transparent 24%),
        var(--bg);
    }
    button,input,textarea,select{font:inherit}
    button{cursor:pointer;border:0;outline:0}
    img{display:block;max-width:100%}
    a{text-decoration:none;color:inherit}

    .topbar{
      display:flex;align-items:center;justify-content:space-between;
      padding:7px 5%;font-size:11px;color:#fff;
      background:var(--primary);border-bottom:1px solid var(--accent)
    }
    .topbar-group{display:flex;gap:20px}
    .topbar i{color:var(--primary);margin-right:5px}

    header{
      position:sticky;top:0;z-index:50;
      display:flex;align-items:center;justify-content:space-between;
      gap:20px;padding:13px 4%;
      background:var(--accent);
      backdrop-filter:blur(18px);
      border-bottom:1px solid var(--border)
    }
    .logo{display:flex;align-items:center;gap:10px;font-size:21px;font-weight:800;letter-spacing:.5px;cursor:pointer;line-height:1}.logo img{width:42px;height:42px;object-fit:contain;border-radius:9px}.logo-text{display:flex;flex-direction:column}
    .logo b{color:var(--primary)}
    .logo small{display:block;margin-top:5px;font-size:7px;letter-spacing:2.2px;color:var(--muted);font-weight:500}
    .head-actions{display:flex;gap:8px}
    .iconbtn{
      position:relative;width:40px;height:40px;border-radius:11px;
      color:#fff;background:var(--surface-3);border:1px solid var(--border);
      transition:.2s
    }
    .iconbtn:hover{border-color:rgba(0,37,97,.45);transform:translateY(-1px)}
    .badge{
      position:absolute;right:-5px;top:-6px;min-width:19px;height:19px;
      display:grid;place-items:center;padding:0 5px;border-radius:20px;
      background:var(--danger);color:#fff;font-size:9px;font-weight:800
    }

    .search-wrapper{padding:12px 4% 0;max-width:1240px;margin:auto;transition:.2s}
    .search-wrapper.search-hidden{display:none}
    .search{
      display:flex;width:100%;overflow:hidden;border:1px solid var(--border);
      border-radius:14px;background:rgba(9,16,31,.92);box-shadow:0 7px 25px rgba(0,0,0,.18)
    }
    .search:focus-within{border-color:rgba(0,37,97,.55);box-shadow:0 0 0 3px rgba(0,37,97,.07)}
    .search input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:#fff;padding:13px 15px;font-size:13px}
    .search button{padding:0 20px;background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;font-size:14px}

    .container{width:min(1240px,92%);margin:auto;padding-top:16px}
    .app-view{display:none;animation:fadeIn .25s ease}
    .app-view.active-view{display:block}
    @keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

    .hero{display:grid;grid-template-columns:1fr 290px;gap:18px;margin:10px 0 26px}
    .hero-slider{
      position:relative;width:100%;overflow:hidden;border-radius:22px;
      border:1px solid var(--border);box-shadow:var(--shadow);background:#0b1424
    }
    .slides{display:flex;width:100%;height:auto;transition:transform .55s cubic-bezier(.22,.61,.36,1);align-items:flex-start}
    .slide{
      min-width:100%;width:100%;height:auto;min-height:0;position:relative;
      overflow:hidden;background:#0b1424;
    }
    .slide img{
      display:block;width:100%;height:auto;max-width:100%;
      object-fit:contain;object-position:center center;
      filter:saturate(1.18) contrast(1.08) brightness(1.04);
    }
    .slide-overlay,.slide-content{display:none!important}
    .tag{
      display:inline-flex;align-items:center;gap:5px;padding:5px 10px;
      border-radius:7px;font-size:10px;font-weight:800;letter-spacing:.3px;
      color:var(--primary);background:rgba(0,37,97,.12);border:1px solid rgba(0,37,97,.4)
    }
    .slide-content h1{margin:12px 0 9px;font-size:clamp(28px,4vw,44px);line-height:1.1;letter-spacing:-1px}
    .slide-content h1 span{color:var(--primary)}
    .slide-content p{max-width:500px;color:#d0d0d0;font-size:12px;line-height:1.8;margin-bottom:18px}
    .hero-btn,.primary{
      display:inline-flex;align-items:center;justify-content:center;gap:8px;
      padding:11px 18px;border-radius:10px;color:#fff;font-weight:800;font-size:12px;
      background:linear-gradient(135deg,var(--primary),var(--primary-2));
      box-shadow:0 8px 24px rgba(0,37,97,.2)
    }
    .slider-controls{position:absolute;right:15px;bottom:15px;z-index:10;display:flex;gap:7px}
    .slider-btn{
      width:34px;height:34px;display:grid;place-items:center;border-radius:50%;
      background:rgba(12,22,39,.82);color:#fff;border:1px solid var(--border)
    }
    .dots{position:absolute;left:25px;bottom:21px;z-index:10;display:flex;gap:6px}
    .dot-item{width:7px;height:7px;border-radius:20px;background:rgba(255,255,255,.3);cursor:pointer;transition:.25s}
    .dot-item.active{width:23px;background:var(--primary)}

    .trust{display:grid;gap:10px}
    .trust-card{
      display:flex;align-items:center;gap:13px;padding:15px;
      border:1px solid var(--border);border-radius:16px;background:linear-gradient(145deg,#0e1729,#0a1120)
    }
    .trust-card i{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;color:var(--primary);background:rgba(0,37,97,.1)}
    .trust-card b{display:block;font-size:12px}
    .trust-card small{color:var(--muted);font-size:9px}

    .page-title{
      display:flex;align-items:center;gap:10px;padding-bottom:12px;margin-bottom:17px;
      border-bottom:1px solid var(--border);font-size:20px;font-weight:700
    }
    .page-title i{color:var(--primary)}
    .section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:16px 0}
    .section-head h2{font-size:18px}
    .view-all{background:transparent;color:var(--primary);font-size:12px;font-weight:700}

    .categories{display:flex;gap:8px;overflow-x:auto;padding:3px 0 14px;scrollbar-width:none}
    .categories::-webkit-scrollbar{display:none}
    .cat{
      white-space:nowrap;padding:9px 14px;border-radius:20px;color:#cdd9e8;
      background:var(--surface-3);border:1px solid var(--border);font-size:11px;transition:.2s
    }
    .cat:hover{border-color:rgba(0,37,97,.35)}
    .cat.active{color:#fff;background:linear-gradient(135deg,var(--primary),var(--primary-2));border-color:transparent;font-weight:800}

    .products{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
    .product{min-width:0;overflow:hidden;background:linear-gradient(155deg,#0d1728,#08101d);border:1px solid rgba(255,255,255,.075);border-radius:18px;transition:.25s;cursor:pointer;position:relative}
    .product:hover{transform:translateY(-4px);border-color:rgba(0,37,97,.42);box-shadow:0 18px 42px rgba(0,0,0,.3)}
    .pimg{position:relative;width:100%;height:235px;background:linear-gradient(145deg,#fff,#f4f7fb);overflow:hidden;display:flex;align-items:center;justify-content:center}
    .pimg:after{content:'VIEW DETAILS';position:absolute;right:10px;bottom:10px;padding:5px 8px;border-radius:7px;background:rgba(5,8,18,.78);color:#fff;font-size:8px;font-weight:800;letter-spacing:.6px;opacity:0;transform:translateY(4px);transition:.2s}
    .product:hover .pimg:after{opacity:1;transform:none}
    .pimg img{width:100%;height:100%;padding:8px;object-fit:contain;object-position:center;transition:.35s}
    .product:hover .pimg img{transform:scale(1.035)}
    .pbody{padding:14px 14px 15px}.pbody h3{height:40px;overflow:hidden;margin-bottom:9px;font-size:13px;line-height:1.5;font-weight:700}.price{color:var(--primary);font-size:16px;font-weight:800}.old{margin-left:7px;color:var(--muted);font-size:10px;text-decoration:line-through}
    .product-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.055);color:var(--muted);font-size:9px}.product-meta span:first-child{color:#b9c8db}.product-meta i{color:var(--primary);margin-right:4px}
    .products-hero{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;padding:22px;margin-bottom:17px;border-radius:20px;background:radial-gradient(circle at 90% 0%,rgba(0,37,97,.16),transparent 38%),linear-gradient(145deg,#0e192b,#080f1c);border:1px solid var(--border);box-shadow:0 15px 40px rgba(0,0,0,.2)}
    .products-hero-copy{max-width:650px}.products-hero-copy .eyebrow{display:inline-flex;align-items:center;gap:6px;color:#aee3ff;font-size:9px;font-weight:800;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px}.products-hero-copy .eyebrow i{color:var(--primary)}.products-hero h1{font-size:clamp(22px,4vw,32px);line-height:1.15;margin-bottom:7px}.products-hero p{font-size:10px;line-height:1.7;color:var(--muted)}.products-stat{min-width:120px;padding:13px;border-radius:14px;background:rgba(5,8,18,.45);border:1px solid var(--border);text-align:center}.products-stat b{display:block;color:var(--primary);font-size:22px;line-height:1.1}.products-stat span{display:block;margin-top:4px;color:var(--muted);font-size:8px;text-transform:uppercase;letter-spacing:.8px}
    .product-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;padding:10px 12px;border-radius:13px;background:rgba(10,17,31,.7);border:1px solid var(--border)}.product-toolbar-left{display:flex;align-items:center;gap:8px;min-width:0}.live-dot{width:7px;height:7px;border-radius:50%;background:var(--success);box-shadow:0 0 0 4px rgba(255,109,0,.08)}.product-toolbar small{color:var(--muted);font-size:9px}.product-toolbar strong{font-size:10px;color:#f5f5f5}.product-toolbar-right{color:var(--muted);font-size:9px}

    .product-detail-modal{width:min(1040px,100%);max-height:92vh;overflow-y:auto}.product-detail{display:grid;grid-template-columns:1.1fr .9fr;gap:24px}.gallery{min-width:0}.gallery-main{position:relative;width:100%;height:455px;background:linear-gradient(145deg,#fff,#f4f7fb);border-radius:18px;overflow:hidden;border:1px solid rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;box-shadow:0 15px 40px rgba(0,0,0,.18)}.gallery-main img{width:100%;height:100%;padding:14px;object-fit:contain;object-position:center;transition:.25s}.gallery-count{position:absolute;left:14px;top:14px;padding:6px 9px;border-radius:8px;background:rgba(5,8,18,.78);color:#fff;font-size:9px;font-weight:800;letter-spacing:.4px;z-index:3}.gallery-label{position:absolute;right:14px;top:14px;padding:6px 9px;border-radius:8px;color:#ffffff;background:rgba(0,37,97,.16);border:1px solid rgba(0,37,97,.25);font-size:8px;font-weight:800;z-index:3}.gallery-arrow{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:rgba(5,8,18,.82);color:#fff;border:1px solid rgba(255,255,255,.16);z-index:4;transition:.2s}.gallery-arrow:hover{background:var(--primary);transform:translateY(-50%) scale(1.04)}.gallery-arrow.prev{left:13px}.gallery-arrow.next{right:13px}.gallery-thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:11px}.gallery-thumb{height:88px;position:relative;border-radius:12px;overflow:hidden;background:#fff;border:2px solid transparent;padding:0;transition:.2s}.gallery-thumb:hover{border-color:rgba(0,37,97,.5)}.gallery-thumb.active{border-color:var(--primary);box-shadow:0 0 0 2px rgba(0,37,97,.12)}.gallery-thumb img{width:100%;height:100%;padding:3px;object-fit:contain}.thumb-number{position:absolute;left:6px;bottom:6px;padding:3px 5px;border-radius:5px;background:rgba(5,8,18,.78);color:#fff;font-size:7px;font-weight:800}.gallery-hint{text-align:center;color:var(--muted);font-size:8px;margin-top:7px}.detail-info{padding:8px 3px}.detail-topline{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}.detail-cat{display:inline-flex;padding:6px 9px;border-radius:7px;color:#ffffff;background:rgba(0,37,97,.1);border:1px solid rgba(0,37,97,.25);font-size:9px;font-weight:800}.detail-views{color:var(--muted);font-size:8px}.detail-info h2{font-size:25px;line-height:1.3;margin-bottom:10px}.detail-price{font-size:24px;color:var(--primary);font-weight:800}.detail-old{margin-left:8px;color:var(--muted);font-size:11px;text-decoration:line-through}.detail-desc{margin:16px 0;color:#d0d0d0;font-size:11px;line-height:1.85;white-space:pre-line}.detail-feature-list{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}.detail-feature{padding:9px;border-radius:10px;background:#0d1727;border:1px solid var(--border);color:#e5e5e5;font-size:8px}.detail-feature i{color:var(--primary);margin-right:5px}.detail-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:18px}.detail-actions button{padding:13px;border-radius:11px;font-size:10px;font-weight:800}.detail-buy{color:#fff;background:linear-gradient(135deg,var(--primary),var(--primary-2));box-shadow:0 8px 22px rgba(0,37,97,.17)}.detail-cart{color:#f5f5f5;background:var(--surface-3);border:1px solid var(--border)}

    .product-detail-modal{background:#fff!important;color:#111!important;border:1px solid rgba(255,109,0,.28)!important;box-shadow:0 30px 90px rgba(0,0,0,.28)!important}
    .product-detail-modal .modalhead{background:#fff;color:#111;border-bottom:1px solid rgba(0,0,0,.08)}
    .product-detail-modal .modalhead i{color:#002561}
    .product-detail-modal .close{background:#111;color:#fff;border-color:#111;border-radius:50%;width:32px;height:32px;display:grid;place-items:center}
    .product-detail-modal .modalbody{background:#fff}
    .gallery-main{background:linear-gradient(145deg,#fff,#f7f7f7)!important;border:1px solid rgba(0,0,0,.08)!important;box-shadow:0 18px 45px rgba(0,0,0,.08)!important}
    .gallery-count,.thumb-number{background:#111!important;color:#fff!important}
    .gallery-label,.detail-cat{color:#001A45!important;background:rgba(255,109,0,.09)!important;border-color:rgba(255,109,0,.35)!important}
    .gallery-arrow{background:#111!important;color:#fff!important;border-color:#111!important}
    .gallery-arrow:hover{background:#002561!important}
    .gallery-thumb{background:#fff!important;border-color:rgba(0,0,0,.08)!important}
    .gallery-thumb.active{border-color:#002561!important;box-shadow:0 0 0 3px rgba(255,109,0,.14)!important}
    .detail-info h2{color:#111!important;font-weight:850}
    .detail-price{color:#FF6D00!important}
    .detail-desc{color:#666!important}
    .detail-feature{background:#f8f8f8!important;color:#333!important;border-color:rgba(0,0,0,.08)!important}
    .detail-feature i{color:#002561!important}
    .detail-qty-box{margin-top:15px;padding:13px;border-radius:14px;background:linear-gradient(145deg,#fff,#f8f8f8);border:1px solid rgba(255,109,0,.32);box-shadow:0 8px 25px rgba(0,0,0,.06)}
    .detail-qty-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
    .detail-qty-title span{font-size:10px;font-weight:900;letter-spacing:.5px;color:#111}
    .detail-qty-title span i{color:#002561;margin-right:5px}
    .detail-qty-title small{font-size:8px;color:#777}
    .detail-qty-row{display:flex;align-items:center;gap:9px}
    .detail-qty-btn{width:39px;height:39px;border-radius:10px;background:#111;color:#fff;border:0;font-size:21px;font-weight:800;cursor:pointer;transition:.2s}
    .detail-qty-btn:hover{background:#002561;transform:translateY(-1px)}
    .detail-qty-value{min-width:55px;text-align:center}
    .detail-qty-value span{display:block;font-size:17px;font-weight:900;color:#111;line-height:1}
    .detail-qty-value small{display:block;margin-top:4px;font-size:7px;font-weight:800;color:#999;letter-spacing:1px}
    .detail-total{margin-left:auto;text-align:right;padding-left:12px;border-left:1px solid rgba(0,0,0,.09)}
    .detail-total small{display:block;font-size:7px;color:#888;letter-spacing:1px;font-weight:800}
    .detail-total strong{display:block;margin-top:3px;color:#FF6D00;font-size:15px}
    .detail-cart{background:#111!important;color:#fff!important;border-color:#111!important}
    .detail-buy{background:linear-gradient(135deg,#FF6D00,#FF6D00)!important;color:#fff!important;box-shadow:0 10px 25px rgba(255,109,0,.22)!important}

    @media(max-width:680px){
      .products-hero{align-items:stretch;flex-direction:column;padding:17px}.products-stat{min-width:0}.product-toolbar{padding:9px}.product-toolbar-right{display:none}
      .pimg{height:190px}
      .product-detail{grid-template-columns:1fr;gap:15px}
      .gallery-main{height:310px}
      .gallery-thumb{height:68px}
      .detail-info h2{font-size:19px}
      .detail-qty-title{align-items:flex-start;flex-direction:column;gap:3px}
      .detail-total strong{font-size:13px}
    }

    .empty{
      grid-column:1/-1;text-align:center;padding:55px 20px;color:var(--muted);
      border:1px dashed var(--border);border-radius:16px;background:rgba(10,17,31,.55)
    }
    .empty i{font-size:27px;color:var(--primary);margin-bottom:12px}

    .track{
      margin:10px 0 24px;padding:20px;border-radius:18px;
      background:linear-gradient(145deg,#0d182a,#09111f);border:1px solid var(--border)
    }
    .track-title{font-size:14px;font-weight:700}
    .track-form{display:flex;gap:8px;margin-top:12px}
    .track-form input,.field input,.field textarea,.field select{
      width:100%;padding:11px 12px;border-radius:10px;background:#060c17;color:#fff;
      border:1px solid var(--border);outline:0;font-size:12px
    }
    .track-form input:focus,.field input:focus,.field textarea:focus,.field select:focus{border-color:rgba(0,37,97,.5)}
    .track-form button{padding:0 16px;border-radius:10px;white-space:nowrap;color:#fff;background:var(--surface-3);border:1px solid var(--border);font-size:11px;font-weight:800}

    .order-card{
      padding:18px;margin-bottom:14px;border-radius:17px;background:#080f1c;border:1px solid var(--border)
    }
    .order-header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:12px;margin-bottom:13px;border-bottom:1px solid var(--border)}
    .order-header b{color:var(--primary);font-size:15px}
    .status{padding:5px 10px;border-radius:20px;font-size:9px;font-weight:800}
    .status.pending{color:var(--warning);background:rgba(255,109,0,.1);border:1px solid rgba(255,109,0,.25)}
    .order-grid-info{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:12px;border-radius:11px;background:#0d1626;font-size:11px}
    .order-grid-info div span{display:block;color:var(--muted);font-size:9px;margin-bottom:2px}

    .account-card{
      width:min(620px,100%);margin:0 auto;padding:22px;border-radius:20px;
      background:linear-gradient(145deg,#0d1728,#080f1b);border:1px solid var(--border);box-shadow:var(--shadow)
    }
    .account{display:flex;align-items:center;gap:14px}
    .avatar{
      width:62px;height:62px;display:grid;place-items:center;border-radius:50%;
      color:#fff;font-size:24px;font-weight:800;background:linear-gradient(135deg,var(--primary),var(--primary-2))
    }
    .account-details{margin:17px 0;padding:13px;border-radius:13px;background:#060c17;border:1px solid var(--border)}
    .acc-info-row{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:11px;word-break:break-word}
    .acc-info-row:last-child{border-bottom:0}
    .acc-info-row i{width:17px;color:var(--primary);margin-top:2px}
    .btn-logout{width:100%;padding:12px;border-radius:10px;color:var(--danger);background:rgba(255,109,0,.09);border:1px solid rgba(255,109,0,.22);font-size:11px;font-weight:800}

    .field{margin-bottom:12px}
    .field label{display:block;margin-bottom:5px;color:var(--muted);font-size:10px}
    .primary{width:100%;border:0}
    .modal{

.order-timeline{
  margin-top:18px;
  padding:20px 18px 22px;
  border:1px solid var(--border);
  border-radius:16px;
  background:linear-gradient(180deg,#0b1424,#08111e);
}
.timeline-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:22px;
  font-size:11px;
  color:#fff;
}
.timeline-title b{font-size:13px;display:flex;align-items:center;gap:7px}
.timeline-title b i{color:var(--primary)}
.timeline-title span{
  font-size:9px;
  color:var(--muted);
  border:1px solid var(--border);
  border-radius:999px;
  padding:5px 9px;
  text-transform:uppercase;
  font-weight:800;
}
.timeline{
  position:relative;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  align-items:start;
  min-height:105px;
  padding:0 5px;
}
.timeline-line{
  position:absolute;
  left:12.5%;
  right:12.5%;
  top:27px;
  height:4px;
  border-radius:99px;
  background:#263449;
  z-index:0;
}
.timeline-progress{
  position:absolute;
  left:12.5%;
  top:27px;
  height:4px;
  border-radius:99px;
  background:linear-gradient(90deg,#002561,#002561,#FF6D00,#FF6D00);
  z-index:1;
  transition:width .35s ease;
}
.timeline-step{
  position:relative;
  z-index:2;
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  min-width:0;
}
.timeline-dot{
  width:54px;
  height:54px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:#111c2e;
  border:3px solid #34445b;
  color:#718096;
  font-size:18px;
  box-shadow:0 0 0 7px #08111e;
  transition:.25s ease;
}
.timeline-step b{
  margin-top:10px;
  color:#cbd5e1;
  font-size:10px;
  line-height:1.25;
}
.timeline-step small{
  margin-top:4px;
  color:#65758d;
  font-size:8px;
  font-weight:700;
  text-transform:uppercase;
}
.timeline-step:nth-child(4) .timeline-dot{border-color:#002561;color:#002561}
.timeline-step:nth-child(5) .timeline-dot{border-color:#002561;color:#002561}
.timeline-step:nth-child(6) .timeline-dot{border-color:#FF6D00;color:#FF6D00}
.timeline-step:nth-child(7) .timeline-dot{border-color:#FF6D00;color:#FF6D00}
.timeline-step.done:nth-child(4) .timeline-dot{background:#002561;color:#fff;box-shadow:0 0 0 7px #08111e,0 0 18px rgba(0,37,97,.28)}
.timeline-step.done:nth-child(5) .timeline-dot{background:#002561;color:#fff;box-shadow:0 0 0 7px #08111e,0 0 18px rgba(0,37,97,.28)}
.timeline-step.done:nth-child(6) .timeline-dot{background:#FF6D00;color:#101010;box-shadow:0 0 0 7px #08111e,0 0 18px rgba(255,109,0,.28)}
.timeline-step.active:nth-child(4) .timeline-dot{background:#002561;color:#fff;box-shadow:0 0 0 7px #08111e,0 0 24px rgba(0,37,97,.4)}
.timeline-step.active:nth-child(5) .timeline-dot{background:#002561;color:#fff;box-shadow:0 0 0 7px #08111e,0 0 24px rgba(0,37,97,.4)}
.timeline-step.active:nth-child(6) .timeline-dot{background:#FF6D00;color:#101010;box-shadow:0 0 0 7px #08111e,0 0 24px rgba(255,109,0,.4)}
.timeline-step.active:nth-child(7) .timeline-dot{background:#FF6D00;color:#fff;box-shadow:0 0 0 7px #08111e,0 0 24px rgba(255,109,0,.4)}
.timeline-step.done b,.timeline-step.active b{color:#fff}
.timeline-step.done small{color:#FF6D00}
.timeline-step.active small{color:#fff}
.timeline-rejected{
  display:flex;
