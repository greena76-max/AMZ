<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#002561">
  <meta name="description" content="HY STORE - Official Online Store">
  <link rel="icon" type="image/png" sizes="48x48" href="logo.png">
  <link rel="shortcut icon" type="image/png" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">
  <title>HY STORE | Official Online Store</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <style>
    :root{
      --bg:#050812;
      --surface:#0a1020;
      --surface-2:#0e1729;
      --surface-3:#121d33;
      --header:rgba(5,8,18,.88);
      --text:#f8fafc;
      --muted:#8fa0b8;
      --primary:#002561;
      --primary-2:#001A45;
      --accent:#FF6D00;
      --danger:#ff5470;
      --warning:#FF6D00;
      --success:#27d17f;
      --border:rgba(255,255,255,.08);
      --shadow:0 50px 60px rgba(0,0,0,.35);
      --radius:18px;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      min-height:100vh;color:var(--text);font-family:Poppins,Arial,sans-serif;
      background:var(--bg);padding-bottom:84px;
    }
    header{
      position:sticky;top:0;z-index:50;display:flex;align-items:center;
      justify-content:space-between;padding:15px 5%;background:var(--surface);
      border-bottom:1px solid var(--border);backdrop-filter:blur(10px);
    }
    .logo{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:800;color:#fff}
    .logo i{color:var(--accent)}
    .container{width:min(1240px,92%);margin:auto;padding-top:25px}
    
    .hero{
      background:linear-gradient(135deg,var(--surface),var(--surface-2));
      border:1px solid var(--border);border-radius:var(--radius);
      padding:40px 25px;margin-bottom:30px;text-align:center;
    }
    .hero h1{font-size:28px;font-weight:700;margin-bottom:10px;color:#fff}
    .hero p{color:var(--muted);font-size:14px;max-width:600px;margin:0 auto}

    .section-title{font-size:18px;font-weight:600;margin-bottom:15px;color:#fff;display:flex;align-items:center;gap:8px}
    
    .products-grid{
      display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px;
    }
    .product-card{
      background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
      overflow:hidden;display:flex;flex-direction:column;transition:transform .2s ease;
    }
    .product-card:hover{transform:translateY(-4px)}
    .product-img{
      height:180px;background:var(--surface-2);display:flex;align-items:center;
      justify-content:center;color:var(--muted);font-size:40px;position:relative;
    }
    .product-body{padding:18px;display:flex;flex-direction:column;flex-grow:1}
    .product-title{font-size:16px;font-weight:600;margin-bottom:8px;color:#fff}
    .product-price{font-size:15px;font-weight:700;color:var(--accent);margin-bottom:15px}
    .btn-buy{
      margin-top:auto;background:var(--primary);color:#fff;border:none;
      padding:10px 15px;border-radius:10px;font-weight:600;cursor:pointer;
      display:flex;align-items:center;justify-content:center;gap:8px;transition:background .2s;
    }
    .btn-buy:hover{background:var(--primary-2)}
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <i class="fa-solid fa-store"></i> HY STORE
    </div>
  </header>

  <div class="container">
    <div class="hero">
      <h1>Welcome to HY STORE</h1>
      <p>Explore our exclusive collection of products with top-notch quality and best prices.</p>
    </div>

    <div class="section-title">
      <i class="fa-solid fa-box-open"></i> Featured Products
    </div>

    <div class="products-grid">
      <!-- Product 1 -->
      <div class="product-card">
        <div class="product-img">
          <i class="fa-solid fa-bag-shopping"></i>
        </div>
        <div class="product-body">
          <div class="product-title">Sample Product 1</div>
          <div class="product-price">Rs. 1,500</div>
          <button class="btn-buy"><i class="fa-solid fa-cart-shopping"></i> Order Now</button>
        </div>
      </div>

      <!-- Product 2 -->
      <div class="product-card">
        <div class="product-img">
          <i class="fa-solid fa-box"></i>
        </div>
        <div class="product-body">
          <div class="product-title">Sample Product 2</div>
          <div class="product-price">Rs. 2,500</div>
          <button class="btn-buy"><i class="fa-solid fa-cart-shopping"></i> Order Now</button>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
