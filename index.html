<script>
async function handleFormSubmit(event) {
    event.preventDefault();

    const formData = {
        fullName: document.getElementById('fullName').value,
        fatherName: document.getElementById('fatherName').value,
        address: document.getElementById('address').value,
        place: document.getElementById('place').value,
        tehsil: document.getElementById('tehsil').value,
        dateOfArrival: document.getElementById('dateOfArrival').value,
        occupation: document.getElementById('occupation').value,
        dob: document.getElementById('dob').value,
        identification: document.getElementById('identification').value,
        nic: document.getElementById('nic').value,
        maritalStatus: document.getElementById('maritalStatus').value,
        mobile: document.getElementById('mobile').value
    };

    // Google Sheet URL
    const scriptURL = 'YOUR_GOOGLE_APPS_SCRIPT_URL_HERE';
    
    try {
        fetch(scriptURL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(formData)
        });
    } catch (error) {
        console.error('Error saving to sheet:', error);
    }

    generatePDF(formData);
}

function generatePDF(data) {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();

    doc.setFont("helvetica", "bold");
    doc.setFontSize(14);
    doc.text("DOMICILE SUBMISSION FORM:", 15, 15);

    doc.setFontSize(9);
    let y = 22;
    const rowHeight = 7.5;
    const col1 = 15;
    const col2 = 70;
    const pageWidth = 195;

    const fields = [
        ["Full Name:", data.fullName],
        ["Father / Husband Name:", data.fatherName],
        ["Address:", data.address],
        ["Place:", data.place],
        ["Tehsil:", data.tehsil],
        ["Date of Arrival:", data.dateOfArrival],
        ["Occupation:", data.occupation],
        ["Date of Birth:", data.dob],
        ["Mark of Identification:", data.identification],
        ["NIC Holder:", ""],
        ["NIC Number:", "SPECIAL_NIC"], // Iske liye alag boxes banenge
        ["Marital Status:", data.maritalStatus],
        ["Spouse Name:", ""],
        ["Remarks:", ""],
        ["Mobile Number:", "SPECIAL_MOBILE"] // Iske liye bhi alag boxes banenge
    ];

    fields.forEach(field => {
        doc.rect(col1, y, 55, rowHeight);
        
        doc.setFont("helvetica", "bold");
        doc.text(field[0], col1 + 2, y + 4.8);
        
        if (field[1] === "SPECIAL_NIC") {
            // NIC Number ke liye 13 alag boxes (khanay)
            doc.rect(col2, y, pageWidth - col2, rowHeight);
            let nicDigits = data.nic.split('');
            let boxWidth = (pageWidth - col2) / 13;
            for (let i = 0; i < 13; i++) {
                doc.rect(col2 + (i * boxWidth), y, boxWidth, rowHeight);
                if (nicDigits[i]) {
                    doc.setFont("helvetica", "normal");
                    doc.text(nicDigits[i], col2 + (i * boxWidth) + (boxWidth / 2) - 1.5, y + 4.8);
                }
            }
        } else if (field[1] === "SPECIAL_MOBILE") {
            // Mobile Number ke liye 12 alag boxes (khanay)
            doc.rect(col2, y, pageWidth - col2, rowHeight);
            let mobDigits = data.mobile.split('');
            let boxWidth = (pageWidth - col2) / 12;
            for (let i = 0; i < 12; i++) {
                doc.rect(col2 + (i * boxWidth), y, boxWidth, rowHeight);
                if (mobDigits[i]) {
                    doc.setFont("helvetica", "normal");
                    doc.text(mobDigits[i], col2 + (i * boxWidth) + (boxWidth / 2) - 1.5, y + 4.8);
                }
            }
        } else {
            doc.rect(col2, y, pageWidth - col2, rowHeight);
            doc.setFont("helvetica", "normal");
            doc.text(field[1] || "", col2 + 2, y + 4.8);
        }
        
        y += rowHeight;
    });

    // Document Attached Section
    y += 4;
    doc.setFont("helvetica", "bold");
    doc.setFontSize(11);
    doc.text("DOCUMENT ATTACHED:", col1, y);
    y += 5;

    doc.setFontSize(9);
    const docsList = [
        "CNIC", "Father CNIC", "Husband CNIC", "Birth Certificate", "Bank Receipt",
        "Photographs", "Property Documents", "Utility Bill", "Resident Certificate",
        "School Certificate", "Voter List", "Dully Filled P1 Form", "Domicile Affidavit", "Form-B"
    ];

    docsList.forEach(docName => {
        doc.rect(col1, y, 90, 5.5);
        doc.rect(col1 + 90, y, 90, 5.5);
        doc.text(docName, col1 + 2, y + 3.8);
        y += 5.5;
    });

    doc.save("Domicile_Submission_Form.pdf");
}
</script>
