<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMZ PRINTS - Place Order</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; padding: 20px; }
        .card { background: white; max-width: 400px; margin: 30px auto; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; margin-bottom: 20px; }
        label { font-weight: bold; display: block; margin-top: 12px; }
        input, select, button { width: 100%; padding: 10px; margin-top: 6px; box-sizing: border-box; border-radius: 4px; border: 1px solid #ccc; }
        button { background: #28a745; color: white; border: none; font-size: 16px; margin-top: 20px; cursor: pointer; font-weight: bold; }
        button:hover { background: #218838; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Place Your Order</h2>
        <form action="https://script.google.com/macros/s/AKfycbya_T4A0Ea2aRzMREdB1IoBpt_1vg_Zic0jMVSS7NixbhNQ88BZKGhza9LVQbhsmj-TPw/exec" method="POST">
            <label>Full Name</label>
            <input type="text" name="name" placeholder="Enter your name" required>
            
            <label>Phone Number</label>
            <input type="text" name="phone" placeholder="Enter phone number" required>
            
            <label>Address</label>
            <input type="text" name="address" placeholder="Enter full address" required>
            
            <label>Select Product</label>
            <select name="product">
                <option value="Visiting Card">Visiting Card</option>
                <option value="Name Plate">Name Plate</option>
                <option value="Shopping Plate">Shopping Plate</option>
                <option value="Water Bottle">Water Bottle</option>
            </select>
            
            <button type="submit">Submit Order</button>
        </form>
    </div>

</body>
</html>
