<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Domicile Submission Form Generator (A4)</title>
    <!-- jsPDF Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; }
        .container { max-width: 650px; background: white; margin: 20px auto; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { color: #2c3e50; text-align: center; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-weight: bold; margin-bottom: 4px; color: #333; font-size: 14px; }
        input[type="text"] { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #27ae60; color: white; padding: 12px 20px; border: none; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold; margin-top: 15px; }
        button:hover { background-color: #219653; }
    </style>
</head>
<body>

<div class="container">
    <h2>Domicile Form Web Input</h2>
    <form id="domicileForm" onsubmit="handleFormSubmit(event)">
        <div class="form-group"><label>Full Name:</label><input type="text" id="fullName" value=" " required></div>
        <div class="form-group"><label>Father / Husband Name:</label><input type="text" id="fatherName" value=" " required></div>
        <div class="form-group"><label>Address:</label><input type="text" id="address" value=" " required></div>
        <div class="form-group"><label>Place:</label><input type="text" id="place" value=" "></div>
        <div class="form-group"><label>Tehsil:</label><input type="text" id="tehsil" value=" "></div>
        <div class="form-group"><label>Date of Arrival:</label><input type="text" id="dateOfArrival" value=""></div>
        <div class="form-group"><label>Occupation:</label><input type="text" id="occupation" value=" T"></div>
        <div class="form-group"><label>Date of Birth:</label><input type="text" id="dob" value=" "></div>
        <div class="form-group"><label>Mark of Identification:</label><input type="text" id="identification" value=" "></div>
        <div class="form-group"><label>NIC Number (13 Digits):</label><input type="text" id="nic" value=" "></div>
        <div class="form-group"><label>Marital Status:</label><input type="text" id="maritalStatus" value=" "></div>
        <div class="form-group"><label>Mobile Number (12 Digits):</label><input type="text" id="mobile" value=" "></div>
        
        <button type="submit">Save to Google Sheet & Download A4 PDF Form</button>
    </form>
</div>

<script>
async function handleFormSubmit(event) {
    event.preventDefault();

    const formData = {
        fullName: document.getElementById('fullName').value,
        fatherName: document.getElementById('fatherName').value,
        address: document.getElementById('address').value,
        place: document.getElementById('place').value,
        tehsil: document.getElementById('tehsil').value,
        dateOfArrival: document.getElementById('dateOfArrival').value,
        occupation: document.getElementById('occupation').value,
        dob: document.getElementById('dob').value,
        identification: document.getElementById('identification').value,
        nic: document.getElementById('nic').value,
        maritalStatus: document.getElementById('maritalStatus').value,
        mobile: document.getElementById('mobile').value
    };

    // Google Apps Script URL
    const scriptURL = 'https://script.google.com/macros/s/AKfycbx4Ep9aGvx0Dcbw3GEpQ0QSaJ7ooLkBAkDPPDD2RqbkFKZc64jq_qTFd65hll24udBN2A/exec';
    
    try {
        fetch(scriptURL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(formData)
        });
    } catch (error) {
        console.error('Error saving to sheet:', error);
    }

    generatePDF(formData);
}

function generatePDF(data) {
    const { jsPDF } = window.jspdf;
    
    // Explicitly A4 Size set kiya gaya hai ('a4', portrait)
    const doc = new jsPDF({
        orientation: 'portrait',
        unit: 'mm',
        format: 'a4'
    });

    // A4 width is 210mm. Margins left/right 12mm rakhne se printable width 186mm ho jati hai.
    const leftMargin = 12;
    const pageWidth = 186; 
    const col2 = 65; // Label aur input ke darmiyan ki line

    // Title
    doc.setFont("helvetica", "bold");
    doc.setFontSize(13);
    doc.text("DOMICILE SUBMISSION FORM:", leftMargin, 12);

    doc.setFontSize(8.5);
    let y = 16;
    const rowHeight = 6.0;

    const fields = [
        ["Full Name:", data.fullName],
        ["Father / Husband Name:", data.fatherName],
        ["Address:", data.address],
        ["Place:", data.place],
        ["Tehsil:", data.tehsil],
        ["Date of Arrival:", data.dateOfArrival],
        ["Occupation:", data.occupation],
        ["Date of Birth:", data.dob],
        ["Mark of Identifcation:", data.identification],
        ["NIC Holder:", ""],
        ["NIC Number:", "SPECIAL_NIC"],
        ["Marital Status:", data.maritalStatus],
        ["Spouse Name:", ""],
        ["Remarks:", ""],
        ["Mobile Number:", "SPECIAL_MOBILE"]
    ];

    fields.forEach(field => {
        doc.rect(leftMargin, y, 53, rowHeight);
        doc.setFont("helvetica", "bold");
        doc.text(field[0], leftMargin + 2, y + 4.1);
        
        if (field[1] === "SPECIAL_NIC") {
            doc.rect(col2, y, (leftMargin + pageWidth) - col2, rowHeight);
            let nicDigits = data.nic.split('');
            let totalWidth = (leftMargin + pageWidth) - col2;
            let boxWidth = totalWidth / 13;
            for (let i = 0; i < 13; i++) {
                doc.rect(col2 + (i * boxWidth), y, boxWidth, rowHeight);
                if (nicDigits[i]) {
                    doc.setFont("helvetica", "normal");
                    doc.text(nicDigits[i], col2 + (i * boxWidth) + (boxWidth / 2) - 1.2, y + 4.1);
                }
            }
        } else if (field[1] === "SPECIAL_MOBILE") {
            doc.rect(col2, y, (leftMargin + pageWidth) - col2, rowHeight);
            let mobDigits = data.mobile.split('');
            let totalWidth = (leftMargin + pageWidth) - col2;
            let boxWidth = totalWidth / 12;
            for (let i = 0; i < 12; i++) {
                doc.rect(col2 + (i * boxWidth), y, boxWidth, rowHeight);
                if (mobDigits[i]) {
                    doc.setFont("helvetica", "normal");
                    doc.text(mobDigits[i], col2 + (i * boxWidth) + (boxWidth / 2) - 1.2, y + 4.1);
                }
            }
        } else {
            doc.rect(col2, y, (leftMargin + pageWidth) - col2, rowHeight);
            doc.setFont("helvetica", "normal");
            doc.text(field[1] || "", col2 + 2, y + 4.1);
        }
        
        y += rowHeight;
    });

    // --- DOCUMENT ATTACHED SECTION (A4 Proportioned) ---
    y += 4;
    doc.setFont("helvetica", "bold");
    doc.setFontSize(11);
    doc.text("DOCUMENT ATTACHED:", leftMargin, y);
    y += 4.5;

    doc.setFontSize(8.5);
    const docsList = [
        "CNIC:", "Father CNIC:", "Husband CNIC:", "Birth Certifcate:", "Bank Receipt:",
        "Photographs:", "Property Documents:", "Utility Bill:", "Resident Certifcate:",
        "School Certifcate:", "Voter List:", "Dully Filled P1 Form:", "Domicile Affidavit:", "Form-B:"
    ];

    docsList.forEach(docName => {
        doc.rect(leftMargin, y, 60, 4.8);       // Left column width
        doc.rect(leftMargin + 60, y, 35, 4.8);  // Right check box width
        doc.setFont("helvetica", "bold");
        doc.text(docName, leftMargin + 2, y + 3.4);
        y += 4.8;
    });

    // Save as A4 PDF
    doc.save("Domicile_Submission_Form_A4.pdf");
}
</script>

</body>
</html>
