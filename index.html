```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Domicile Submission Form</title>

<!-- jsPDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #eef2f7;
    min-height: 100vh;
    padding: 25px 15px;
    color: #1f2937;
}

.container {
    width: 100%;
    max-width: 760px;
    margin: auto;
    background: #fff;
    border-radius: 14px;
    box-shadow: 0 10px 35px rgba(0,0,0,0.08);
    overflow: hidden;
}

.header {
    background: linear-gradient(135deg, #123c69, #1769aa);
    color: #fff;
    padding: 25px;
    text-align: center;
}

.header h1 {
    font-size: 25px;
    margin-bottom: 6px;
}

.header p {
    font-size: 14px;
    opacity: .9;
}

.form-area {
    padding: 30px;
}

.section-title {
    font-size: 17px;
    font-weight: bold;
    color: #123c69;
    border-left: 4px solid #1769aa;
    padding-left: 10px;
    margin: 5px 0 20px;
}

.form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
}

.form-group {
    display: flex;
    flex-direction: column;
}

.full {
    grid-column: 1 / -1;
}

label {
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 6px;
    color: #374151;
}

input,
select {
    width: 100%;
    height: 43px;
    border: 1px solid #d1d5db;
    border-radius: 7px;
    padding: 0 12px;
    font-size: 14px;
    outline: none;
    transition: .2s;
    background: #fff;
}

input:focus,
select:focus {
    border-color: #1769aa;
    box-shadow: 0 0 0 3px rgba(23,105,170,.10);
}

input::placeholder {
    color: #9ca3af;
}

.error {
    color: #dc2626;
    font-size: 11px;
    margin-top: 4px;
    display: none;
}

.actions {
    margin-top: 28px;
}

button {
    width: 100%;
    height: 50px;
    border: none;
    border-radius: 8px;
    background: linear-gradient(135deg, #16834b, #20a45c);
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: .2s;
}

button:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 18px rgba(32,164,92,.25);
}

button:disabled {
    opacity: .7;
    cursor: not-allowed;
    transform: none;
}

.status {
    display: none;
    margin-top: 15px;
    padding: 12px;
    border-radius: 7px;
    text-align: center;
    font-size: 13px;
    font-weight: bold;
}

.status.success {
    display: block;
    background: #dcfce7;
    color: #166534;
}

.status.error-status {
    display: block;
    background: #fee2e2;
    color: #991b1b;
}

.footer {
    text-align: center;
    font-size: 11px;
    color: #9ca3af;
    padding: 0 30px 25px;
}

@media (max-width: 650px) {
    body {
        padding: 10px;
    }

    .form-area {
        padding: 20px;
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    .full {
        grid-column: auto;
    }

    .header h1 {
        font-size: 21px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>DOMICILE SUBMISSION FORM</h1>
        <p>Enter applicant information carefully before generating the form</p>
    </div>

    <div class="form-area">

        <div class="section-title">Applicant Information</div>

        <form id="domicileForm" onsubmit="handleFormSubmit(event)">

            <div class="form-grid">

                <div class="form-group">
                    <label for="fullName">Full Name *</label>
                    <input type="text" id="fullName" placeholder="Enter full name" required>
                </div>

                <div class="form-group">
                    <label for="fatherName">Father / Husband Name *</label>
                    <input type="text" id="fatherName" placeholder="Enter father / husband name" required>
                </div>

                <div class="form-group full">
                    <label for="address">Address *</label>
                    <input type="text" id="address" placeholder="Enter complete address" required>
                </div>

                <div class="form-group">
                    <label for="place">Place</label>
                    <input type="text" id="place" placeholder="Enter place">
                </div>

                <div class="form-group">
                    <label for="tehsil">Tehsil</label>
                    <input type="text" id="tehsil" placeholder="Enter tehsil">
                </div>

                <div class="form-group">
                    <label for="dateOfArrival">Date of Arrival</label>
                    <input type="text" id="dateOfArrival" placeholder="DD-MM-YYYY">
                </div>

                <div class="form-group">
                    <label for="occupation">Occupation</label>
                    <input type="text" id="occupation" placeholder="Enter occupation">
                </div>

                <div class="form-group">
                    <label for="dob">Date of Birth</label>
                    <input type="text" id="dob" placeholder="DD-MM-YYYY">
                </div>

                <div class="form-group">
                    <label for="identification">Mark of Identification</label>
                    <input type="text" id="identification" placeholder="Enter identification mark">
                </div>

                <div class="form-group">
                    <label for="maritalStatus">Marital Status</label>
                    <select id="maritalStatus">
                        <option value="">Select status</option>
                        <option value="Single">Single</option>
                        <option value="Married">Married</option>
                        <option value="Widowed">Widowed</option>
                        <option value="Divorced">Divorced</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="nic">NIC Number *</label>
                    <input
                        type="text"
                        id="nic"
                        maxlength="13"
                        inputmode="numeric"
                        placeholder="13 digit CNIC"
                        required
                        oninput="onlyNumbers(this)"
                    >
                    <div class="error" id="nicError">
                        CNIC must contain exactly 13 digits.
                    </div>
                </div>

                <div class="form-group">
                    <label for="mobile">Mobile Number *</label>
                    <input
                        type="text"
                        id="mobile"
                        maxlength="12"
                        inputmode="numeric"
                        placeholder="12 digit mobile number"
                        required
                        oninput="onlyNumbers(this)"
                    >
                    <div class="error" id="mobileError">
                        Mobile number must contain exactly 12 digits.
                    </div>
                </div>

            </div>

            <div class="actions">
                <button type="submit" id="submitBtn">
                    Save to Google Sheet & Download A4 PDF
                </button>

                <div class="status" id="status"></div>
            </div>

        </form>

    </div>

    <div class="footer">
        Domicile Submission System • A4 Print Ready
    </div>

</div>

<script>

const scriptURL =
'https://script.google.com/macros/s/AKfycbx4Ep9aGvx0Dcbw3GEpQ0QSaJ7ooLkBAkDPPDD2RqbkFKZc64jq_qTFd65hll24udBN2A/exec';

function onlyNumbers(input) {
    input.value = input.value.replace(/\D/g, '');
}

function showStatus(message, type) {
    const status = document.getElementById('status');

    status.textContent = message;
    status.className = 'status ' + type;

    setTimeout(() => {
        status.className = 'status';
    }, 5000);
}

function validateForm(data) {

    let valid = true;

    const nicError = document.getElementById('nicError');
    const mobileError = document.getElementById('mobileError');

    nicError.style.display = 'none';
    mobileError.style.display = 'none';

    if (data.nic.length !== 13) {
        nicError.style.display = 'block';
        valid = false;
    }

    if (data.mobile.length !== 12) {
        mobileError.style.display = 'block';
        valid = false;
    }

    return valid;
}

async function handleFormSubmit(event) {

    event.preventDefault();

    const submitBtn = document.getElementById('submitBtn');

    const formData = {
        fullName: document.getElementById('fullName').value.trim(),
        fatherName: document.getElementById('fatherName').value.trim(),
        address: document.getElementById('address').value.trim(),
        place: document.getElementById('place').value.trim(),
        tehsil: document.getElementById('tehsil').value.trim(),
        dateOfArrival: document.getElementById('dateOfArrival').value.trim(),
        occupation: document.getElementById('occupation').value.trim(),
        dob: document.getElementById('dob').value.trim(),
        identification: document.getElementById('identification').value.trim(),
        nic: document.getElementById('nic').value.trim(),
        maritalStatus: document.getElementById('maritalStatus').value.trim(),
        mobile: document.getElementById('mobile').value.trim()
    };

    if (!validateForm(formData)) {
        showStatus('Please correct the highlighted fields.', 'error-status');
        return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Saving & Generating PDF...';

    try {

        /*
         * Save data to Google Sheet
         */
        await fetch(scriptURL, {
            method: 'POST',
            mode: 'no-cors',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(formData)
        });

        /*
         * Generate PDF
         */
        generatePDF(formData);

        showStatus(
            'Form generated successfully. PDF download started.',
            'success'
        );

    } catch (error) {

        console.error(error);

        showStatus(
            'PDF generated, but there was a problem saving to Google Sheet.',
            'error-status'
        );

        generatePDF(formData);

    } finally {

        submitBtn.disabled = false;
        submitBtn.textContent =
            'Save to Google Sheet & Download A4 PDF';
    }
}


/* =========================================================
   PDF GENERATOR
========================================================= */

function generatePDF(data) {

    const { jsPDF } = window.jspdf;

    const doc = new jsPDF({
        orientation: 'portrait',
        unit: 'mm',
        format: 'a4'
    });

    const pageWidth = 210;
    const pageHeight = 297;

    const left = 12;
    const right = 12;
    const contentWidth = pageWidth - left - right;

    const labelWidth = 53;
    const valueX = left + labelWidth;

    let y = 12;

    /* ---------- HEADER ---------- */

    doc.setFillColor(18, 60, 105);
    doc.rect(0, 0, pageWidth, 20, 'F');

    doc.setTextColor(255, 255, 255);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(14);

    doc.text(
        'DOMICILE SUBMISSION FORM',
        pageWidth / 2,
        9,
        { align: 'center' }
    );

    doc.setFontSize(7.5);
    doc.setFont('helvetica', 'normal');

    doc.text(
        'Applicant Information',
        pageWidth / 2,
        14,
        { align: 'center' }
    );

    doc.setTextColor(0, 0, 0);

    y = 25;

    /* ---------- APPLICANT FIELDS ---------- */

    const rowHeight = 6.5;

    const fields = [
        ['Full Name:', data.fullName],
        ['Father / Husband Name:', data.fatherName],
        ['Address:', data.address],
        ['Place:', data.place],
        ['Tehsil:', data.tehsil],
        ['Date of Arrival:', data.dateOfArrival],
        ['Occupation:', data.occupation],
        ['Date of Birth:', data.dob],
        ['Mark of Identification:', data.identification],
        ['NIC Holder:', ''],
        ['NIC Number:', 'SPECIAL_NIC'],
        ['Marital Status:', data.maritalStatus],
        ['Spouse Name:', ''],
        ['Remarks:', ''],
        ['Mobile Number:', 'SPECIAL_MOBILE']
    ];

    fields.forEach(field => {

        /* Label cell */
        doc.setDrawColor(100, 100, 100);
        doc.rect(left, y, labelWidth, rowHeight);

        doc.setFont('helvetica', 'bold');
        doc.setFontSize(7.5);

        doc.text(
            field[0],
            left + 2,
            y + 4.3
        );

        /* Value cell */
        const valueWidth = contentWidth - labelWidth;

        doc.rect(
            valueX,
            y,
            valueWidth,
            rowHeight
        );

        /* NIC */
        if (field[1] === 'SPECIAL_NIC') {

            const boxWidth = valueWidth / 13;

            for (let i = 0; i < 13; i++) {

                const x = valueX + i * boxWidth;

                doc.rect(
                    x,
                    y,
                    boxWidth,
                    rowHeight
                );

                if (data.nic[i]) {

                    doc.setFont('helvetica', 'normal');
                    doc.setFontSize(8);

                    doc.text(
                        data.nic[i],
                        x + boxWidth / 2,
                        y + 4.4,
                        { align: 'center' }
                    );
                }
            }

        }

        /* Mobile */
        else if (field[1] === 'SPECIAL_MOBILE') {

            const boxWidth = valueWidth / 12;

            for (let i = 0; i < 12; i++) {

                const x = valueX + i * boxWidth;

                doc.rect(
                    x,
                    y,
                    boxWidth,
                    rowHeight
                );

                if (data.mobile[i]) {

                    doc.setFont('helvetica', 'normal');
                    doc.setFontSize(8);

                    doc.text(
                        data.mobile[i],
                        x + boxWidth / 2,
                        y + 4.4,
                        { align: 'center' }
                    );
                }
            }

        }

        /* Normal field */
        else {

            doc.setFont('helvetica', 'normal');
            doc.setFontSize(7.8);

            const value = field[1] || '';

            doc.text(
                value,
                valueX + 2,
                y + 4.3,
                {
                    maxWidth: valueWidth - 4
                }
            );
        }

        y += rowHeight;
    });


    /* =====================================================
       DOCUMENT ATTACHED
    ===================================================== */

    y += 5;

    doc.setFont('helvetica', 'bold');
    doc.setFontSize(11);

    doc.text(
        'DOCUMENT ATTACHED:',
        left,
        y
    );

    y += 4;

    const docsList = [
        'CNIC:',
        'Father CNIC:',
        'Husband CNIC:',
        'Birth Certificate:',
        'Bank Receipt:',
        'Photographs:',
        'Property Documents:',
        'Utility Bill:',
        'Resident Certificate:',
        'School Certificate:',
        'Voter List:',
        'Duly Filled P1 Form:',
        'Domicile Affidavit:',
        'Form-B:'
    ];

    const docNameWidth = 70;
    const checkWidth = 20;
    const docRowHeight = 5.5;

    docsList.forEach(docName => {

        /* Document name */
        doc.rect(
            left,
            y,
            docNameWidth,
            docRowHeight
        );

        doc.setFont('helvetica', 'bold');
        doc.setFontSize(7);

        doc.text(
            docName,
            left + 2,
            y + 3.7
        );

        /* Yes */
        doc.rect(
            left + docNameWidth,
            y,
            checkWidth,
            docRowHeight
        );

        doc.setFont('helvetica', 'normal');
        doc.setFontSize(6.5);

        doc.text(
            'YES',
            left + docNameWidth + 10,
            y + 3.7,
            { align: 'center' }
        );

        /* No */
        doc.rect(
            left + docNameWidth + checkWidth,
            y,
            checkWidth,
            docRowHeight
        );

        doc.text(
            'NO',
            left + docNameWidth + checkWidth + 10,
            y + 3.7,
            { align: 'center' }
        );

        y += docRowHeight;
    });


    /* =====================================================
       SIGNATURE SECTION
    ===================================================== */

    y += 8;

    doc.setFont('helvetica', 'bold');
    doc.setFontSize(8);

    doc.text(
        'Applicant Signature: __________________________',
        left,
        y
    );

    doc.text(
        'Date: ________________',
        135,
        y
    );

    y += 9;

    doc.text(
        'Office Use Only: ________________________________________________',
        left,
        y
    );


    /* =====================================================
       FOOTER
    ===================================================== */

    doc.setFont('helvetica', 'normal');
    doc.setFontSize(6.5);
    doc.setTextColor(100, 100, 100);

    doc.text(
        'Domicile Submission Form',
        pageWidth / 2,
        pageHeight - 8,
        { align: 'center' }
    );

    /* ---------- SAVE ---------- */

    const safeName =
        data.fullName
            .replace(/[^a-z0-9]/gi, '_')
            .substring(0, 30) || 'Applicant';

    doc.save(
        `Domicile_${safeName}.pdf`
    );
}

</script>

</body>
</html>
