<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>طیبہ دواخانہ اینڈ حجامہ سنٹر - آن لائن اپائنٹمنٹ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            emeraldDark: '#1e5631',
            emeraldMid: '#2e7d32',
            emeraldLight: '#f4f9f5',
          }
        }
      }
    }
  </script>
</head>
<body class="bg-emeraldLight min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-white rounded-2xl shadow-xl border border-emerald-100 p-6">
    
    <!-- Header -->
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-emeraldDark">طیبہ دواخانہ اینڈ حجامہ سنٹر</h1>
      <p class="text-sm font-medium text-emeraldMid mt-1">Tayyaba Dawakhana & Hijama Center</p>
      <p class="text-xs text-gray-500 mt-2">آن لائن اپائنٹمنٹ بُکنگ</p>
    </div>

    <!-- Booking Form -->
    <form id="appointmentForm" class="space-y-4">
      
      <div>
        <label class="block text-xs font-bold text-emeraldDark uppercase mb-1">مریض کا نام / Full Name</label>
        <input type="text" id="fullName" required class="w-full border border-emerald-300 rounded-lg p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emeraldMid" placeholder="نام درج کریں">
      </div>

      <div>
        <label class="block text-xs font-bold text-emeraldDark uppercase mb-1">فون نمبر / Phone Number</label>
        <input type="tel" id="phone" required class="w-full border border-emerald-300 rounded-lg p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emeraldMid" placeholder="03001234567">
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-bold text-emeraldDark uppercase mb-1">تاریخ / Date</label>
          <input type="date" id="appointmentDate" required class="w-full border border-emerald-300 rounded-lg p-2 text-sm focus:outline-none focus:ring-2 focus:ring-emeraldMid">
        </div>
        <div>
          <label class="block text-xs font-bold text-emeraldDark uppercase mb-1">وقت / Time Slot</label>
          <select id="timeSlot" class="w-full border border-emerald-300 rounded-lg p-2 text-sm focus:outline-none focus:ring-2 focus:ring-emeraldMid">
            <option>10:00 AM - 12:00 PM</option>
            <option>02:00 PM - 04:00 PM</option>
            <option>05:00 PM - 07:00 PM</option>
            <option>08:00 PM - 10:00 PM</option>
          </select>
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-emeraldDark uppercase mb-1">علاج کی قسم / Therapy Type</label>
        <select id="therapyType" class="w-full border border-emerald-300 rounded-lg p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emeraldMid">
          <option>سنت پوائنٹس حجامہ (Sunnah Points)</option>
          <option>سر کا حجامہ (Head Hijama)</option>
          <option>فل باڈی ڈیٹاکس (Full Body Detox)</option>
          <option>عام معائنہ (General Consultation)</option>
        </select>
      </div>

      <button type="submit" id="submitBtn" class="w-full bg-emeraldDark hover:bg-emeraldMid text-white font-bold py-3 rounded-lg shadow transition duration-200">
        اپائنٹمنٹ بُک کریں
      </button>

    </form>

    <!-- Message Alert -->
    <div id="statusMessage" class="hidden mt-4 p-3 rounded-lg text-center text-sm font-semibold"></div>

  </div>

  <script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbzZ1-BGz2PFtGHqMr-LQt7zgd8gBmhZqOzrspY8OE8RDY_RIt8oREXq2E9zBuzGAxoV/exec';
    const form = document.getElementById('appointmentForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusMessage = document.getElementById('statusMessage');

    form.addEventListener('submit', e => {
      e.preventDefault();
      
      submitBtn.disabled = true;
      submitBtn.innerText = 'بُکنگ ہو رہی ہے...';

      const data = {
        fullName: document.getElementById('fullName').value,
        phone: document.getElementById('phone').value,
        appointmentDate: document.getElementById('appointmentDate').value,
        timeSlot: document.getElementById('timeSlot').value,
        therapyType: document.getElementById('therapyType').value
      };

      fetch(scriptURL, {
        method: 'POST',
        mode: 'no-cors',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(data)
      })
      .then(() => {
        statusMessage.className = 'mt-4 p-3 rounded-lg text-center text-sm font-semibold bg-green-100 text-green-800 border border-green-300 block';
        statusMessage.innerText = 'آپ کی اپائنٹمنٹ کامیابی سے بُک ہو گئی ہے!';
        submitBtn.disabled = false;
        submitBtn.innerText = 'اپائنٹمنٹ بُک کریں';
        form.reset();
      })
      .catch(error => {
        statusMessage.className = 'mt-4 p-3 rounded-lg text-center text-sm font-semibold bg-red-100 text-red-800 border border-red-300 block';
        statusMessage.innerText = 'خرابی پیش آئی، دوبارہ کوشش کریں۔';
        submitBtn.disabled = false;
        submitBtn.innerText = 'اپائنٹمنٹ بُک کریں';
      });
    });
  </script>

</body>
</html>
