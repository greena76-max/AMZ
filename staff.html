<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HY Store | Staff Order Management Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { 500: '#e02424', 600: '#d9232d', 700: '#b01820' }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="min-h-screen flex flex-col text-slate-800">

  <!-- Dashboard Top Bar -->
  <header class="bg-slate-900 text-white border-b border-slate-800 sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 bg-brand-600 rounded-xl flex items-center justify-center font-bold text-white text-lg">HY</div>
        <div>
          <h1 class="font-bold text-base leading-tight">Staff Portal</h1>
          <p class="text-[10px] text-slate-400">Order Management System</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="copyStaffPortalLink()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold px-3 py-2 rounded-lg flex items-center gap-1.5 transition-all border border-slate-700">
          <i class="fa-regular fa-copy text-brand-500"></i>
          <span id="copyLinkText">Copy Portal Link</span>
        </button>
        <button onclick="fetchStaffOrders()" class="bg-brand-600 hover:bg-brand-700 text-white text-xs font-bold px-3 py-2 rounded-lg flex items-center gap-2 transition-all">
          <i class="fa-solid fa-rotate"></i>
          <span>Refresh</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">

    <!-- Search & Filter Controls -->
    <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex flex-col sm:flex-row gap-3 items-center justify-between">
      <div class="relative w-full sm:w-80">
        <input type="text" id="staffSearch" oninput="filterStaffTable()" placeholder="Search Order ID, Name, Phone..." class="w-full pl-9 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs outline-none focus:ring-2 focus:ring-brand-500">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
      </div>
      <div class="flex items-center gap-2 w-full sm:w-auto">
        <select id="statusFilter" onchange="filterStaffTable()" class="bg-slate-50 border border-slate-200 text-xs font-semibold rounded-xl px-3 py-2 outline-none w-full sm:w-auto">
          <option value="ALL">All Statuses</option>
          <option value="Pending">Pending</option>
          <option value="Processing">Processing</option>
          <option value="Dispatched">Dispatched</option>
          <option value="Out for Delivery">Out for Delivery</option>
          <option value="Delivered">Delivered</option>
          <option value="Cancelled">Cancelled</option>
        </select>
      </div>
    </div>

    <!-- Orders Table Container -->
    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-slate-50 text-slate-500 uppercase text-[10px] font-extrabold tracking-wider border-b border-slate-200">
              <th class="py-3.5 px-4">Order ID</th>
              <th class="py-3.5 px-4">Customer Info</th>
              <th class="py-3.5 px-4">Items / Details</th>
              <th class="py-3.5 px-4">Total Amount</th>
              <th class="py-3.5 px-4">Current Status</th>
              <th class="py-3.5 px-4 text-center">Action</th>
            </tr>
          </thead>
          <tbody id="ordersTableBody" class="text-xs divide-y divide-slate-100">
            <tr>
              <td colspan="6" class="text-center py-12 text-slate-400 font-medium">
                <i class="fa-solid fa-spinner animate-spin text-brand-600 text-xl mb-2 block"></i>
                Loading order data...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Status Update Modal -->
  <div id="statusModal" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl relative space-y-4">
      <button onclick="closeStatusModal()" class="absolute top-4 right-4 text-slate-400 text-xl">&times;</button>
      <h3 class="font-bold text-slate-900 text-base">Update Order Status</h3>
      <p class="text-xs text-slate-500">Updating status for: <strong id="modalTargetOrderId" class="text-brand-600">HY-XXXX</strong></p>
      
      <select id="newStatusSelect" class="w-full p-3 bg-slate-50 border border-slate-300 rounded-xl text-xs font-semibold outline-none">
        <option value="Pending">Pending</option>
        <option value="Processing">Processing / Personalization</option>
        <option value="Dispatched">Dispatched</option>
        <option value="Out for Delivery">Out for Delivery</option>
        <option value="Delivered">Delivered</option>
        <option value="Cancelled">Cancelled</option>
      </select>

      <button onclick="saveStatusUpdate()" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-bold py-3 rounded-xl transition-all text-xs">Save Status Change</button>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="customToast" class="fixed bottom-6 right-6 z-50 bg-slate-900 text-white text-xs font-semibold px-4 py-3 rounded-xl shadow-2xl border border-slate-800 transform translate-y-20 opacity-0 transition-all duration-300 flex items-center gap-2">
    <i class="fa-solid fa-circle-check text-emerald-400"></i>
    <span id="toastMsg">Link copied!</span>
  </div>

  <script>
    // Updated Apps Script URL
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzhLtDB4ZrzrhBJPTtP23V2GoPNZCsRLSPRuejUUGy-6H3hX9_V5tiYC5gnc9ygZ1DNmg/exec";
    
    let staffOrders = [];
    let currentUpdatingOrderId = null;

    window.onload = function() {
      fetchStaffOrders();
    };

    function showToast(msg) {
      const toast = document.getElementById('customToast');
      document.getElementById('toastMsg').innerText = msg;
      toast.classList.remove('translate-y-20', 'opacity-0');
      setTimeout(() => {
        toast.classList.add('translate-y-20', 'opacity-0');
      }, 3000);
    }

    function copyStaffPortalLink() {
      const portalUrl = "https://hystoreofficial.com/staff.html";
      navigator.clipboard.writeText(portalUrl);
      document.getElementById('copyLinkText').innerText = 'Copied!';
      showToast('Staff dashboard link copied!');
      setTimeout(() => {
        document.getElementById('copyLinkText').innerText = 'Copy Portal Link';
      }, 2000);
    }

    function fetchStaffOrders() {
      const tbody = document.getElementById('ordersTableBody');
      tbody.innerHTML = `<tr><td colspan="6" class="text-center py-12 text-slate-400 font-medium"><i class="fa-solid fa-spinner animate-spin text-brand-600 text-xl mb-2 block"></i> Fetching live orders...</td></tr>`;

      fetch(SCRIPT_URL + '?action=getStaffOrders')
        .then(res => res.json())
        .then(data => {
          if(data.success) {
            staffOrders = data.orders || [];
            renderOrdersTable(staffOrders);
          } else {
            tbody.innerHTML = `<tr><td colspan="6" class="text-center py-8 text-red-500">Failed to load orders.</td></tr>`;
          }
        })
        .catch(err => {
          tbody.innerHTML = `<tr><td colspan="6" class="text-center py-8 text-red-500">Network Error. Check Apps Script URL.</td></tr>`;
        });
    }

    function renderOrdersTable(orders) {
      const tbody = document.getElementById('ordersTableBody');
      if (!orders || orders.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-center py-8 text-slate-400">No orders found.</td></tr>`;
        return;
      }

      tbody.innerHTML = orders.map(o => {
        let badgeClass = "bg-slate-100 text-slate-700";
        if(o.status === "Delivered") badgeClass = "bg-emerald-100 text-emerald-800";
        else if(o.status === "Dispatched" || o.status === "Out for Delivery") badgeClass = "bg-blue-100 text-blue-800";
        else if(o.status === "Processing") badgeClass = "bg-amber-100 text-amber-800";
        else if(o.status === "Cancelled") badgeClass = "bg-red-100 text-red-800";

        let orderSummaryText = `${o.orderId} - ${o.customerName} - ${o.phone} - ${o.items} - PKR ${Number(o.totalAmount).toLocaleString()}`;

        return `
          <tr class="hover:bg-slate-50 transition-colors">
            <td class="py-3.5 px-4 font-mono font-bold text-slate-900">
              ${o.orderId}
              <button onclick="copyOrderDetails('${orderSummaryText.replace(/'/g, "\\'")}')" class="ml-1 text-slate-400 hover:text-brand-600" title="Copy Order Details">
                <i class="fa-regular fa-copy text-[10px]"></i>
              </button>
            </td>
            <td class="py-3.5 px-4">
              <strong class="block text-slate-800">${o.customerName}</strong>
              <span class="text-[11px] text-slate-500 block">${o.phone}</span>
              <span class="text-[10px] text-slate-400 block max-w-xs truncate">${o.address}</span>
            </td>
            <td class="py-3.5 px-4 text-slate-700 max-w-xs truncate">${o.items}</td>
            <td class="py-3.5 px-4 font-extrabold text-brand-600">PKR ${Number(o.totalAmount).toLocaleString()}</td>
            <td class="py-3.5 px-4">
              <span class="px-2.5 py-1 rounded-full text-[10px] font-bold ${badgeClass}">${o.status || 'Pending'}</span>
            </td>
            <td class="py-3.5 px-4 text-center">
              <button onclick="openStatusModal('${o.orderId}', '${o.status}')" class="bg-slate-900 hover:bg-brand-600 text-white px-3 py-1.5 rounded-lg text-[11px] font-bold transition-all">
                Update
              </button>
            </td>
          </tr>
        `;
      }).join('');
    }

    function copyOrderDetails(text) {
      navigator.clipboard.writeText(text);
      showToast('Order details copied to clipboard!');
    }

    function filterStaffTable() {
      const q = document.getElementById('staffSearch').value.toLowerCase();
      const status = document.getElementById('statusFilter').value;

      const filtered = staffOrders.filter(o => {
        const matchesSearch = o.orderId.toLowerCase().includes(q) || o.customerName.toLowerCase().includes(q) || o.phone.toLowerCase().includes(q);
        const matchesStatus = (status === 'ALL') || (o.status === status);
        return matchesSearch && matchesStatus;
      });

      renderOrdersTable(filtered);
    }

    function openStatusModal(orderId, currentStatus) {
      currentUpdatingOrderId = orderId;
      document.getElementById('modalTargetOrderId').innerText = orderId;
      document.getElementById('newStatusSelect').value = currentStatus || 'Pending';
      document.getElementById('statusModal').classList.remove('hidden');
    }

    function closeStatusModal() {
      document.getElementById('statusModal').classList.add('hidden');
    }

    function saveStatusUpdate() {
      const statusVal = document.getElementById('newStatusSelect').value;

      fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({
          action: 'updateOrderStatus',
          orderId: currentUpdatingOrderId,
          status: statusVal
        })
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          closeStatusModal();
          showToast('Order status updated successfully!');
          fetchStaffOrders();
        } else {
          alert('Failed to update status.');
        }
      });
    }
  </script>
</body>
</html>
